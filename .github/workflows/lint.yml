name: Lint

on:
  push:
    branches:
      - master
      - main
    paths:
      - site/**
      - .github/workflows/lint.yml
  pull_request:
    paths:
      - site/**
      - .github/workflows/lint.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (format + lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Check formatting (Prettier)
        working-directory: site
        run: npm run format:check

      - name: Check linting (ESLint)
        working-directory: site
        run: npm run lint:check

      - name: Validate markup (html-validate)
        working-directory: site
        run: npm run validate

      # en/index.html is generated from index.html, so a copy that drifts would
      # silently ship stale English.
      - name: Check the generated English page is in sync
        working-directory: site
        run: |
          npm run build:i18n
          git diff --exit-code -- en/index.html
